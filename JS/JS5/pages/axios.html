<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Axios - Gestión de Alumnos</title>
  <link rel="stylesheet" href="../styles/main.css">
</head>
<body>
  <div id="toast-container"></div>

  <!-- Menú de navegación -->
  <nav class="main-nav">
    <ul>
      <li><a href="fetch.html" id="nav-fetch">⚡ Con Fetch</a></li>
      <li><a href="axios.html" id="nav-axios">🔄 Con Axios</a></li>
      <li><a href="../index.html" id="nav-home" class="nav-home">🏠 Inicio</a></li>
    </ul>
  </nav>

  <header>
    <h1>Axios - Gestión de Alumnos</h1>
    <button id="theme-toggle" class="theme-toggle">🌙 Modo Oscuro</button>
  </header>

  <main class="container">
    <section class="card">
      <h2 id="form-title">Agregar Alumno</h2>
      <form id="alumno-form">
        <input type="hidden" id="alumno-id">
        
        <div class="form-group">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" placeholder="Ingrese el nombre">
          <span class="field-error" id="nombre-error"></span>
        </div>

        <div class="form-group">
          <label for="apellido">Apellido</label>
          <input type="text" id="apellido" name="apellido" placeholder="Ingrese el apellido">
          <span class="field-error" id="apellido-error"></span>
        </div>

        <div class="form-group">
          <label for="edad">Edad</label>
          <input type="number" id="edad" name="edad" placeholder="Ingrese la edad" min="1" max="120">
          <span class="field-error" id="edad-error"></span>
        </div>

        <div class="form-buttons">
          <button type="submit" id="submit-btn" class="btn btn-primary">Guardar</button>
          <button type="button" id="cancel-btn" class="btn btn-secondary" style="display: none;">Cancelar</button>
        </div>
      </form>
    </section>

    <section class="card" style="margin-top: 30px;">
      <h2>Lista de Alumnos</h2>
      <div id="loading" class="loading">Cargando...</div>
      <div id="table-container"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script type="module" src="../scripts/axios.js"></script>
</body>
</html>
