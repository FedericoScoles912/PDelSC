<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto 1 - Formulario de Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/themes.css" id="theme-stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="bi bi-code-slash"></i> Proyecto 1 - Usuarios
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#">Inicio</a>
                    </li>
                </ul>
                <div class="d-flex">
                    <button class="btn btn-outline-secondary" id="theme-toggle">
                        <i class="bi bi-moon-stars-fill" id="theme-icon"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="container-fluid py-4">
        <div class="row mb-4">
            <div class="col-12">
                <h1 class="mb-2"><i class="bi bi-people-fill me-2 text-primary"></i> Formulario de Usuarios</h1>
                <p class="lead text-muted">Formulario de usuarios usando getElementById, querySelector y FormData</p>
            </div>
        </div>

        <div class="row">
            <div class="col-lg-5 mb-4">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="bi bi-person-plus me-2"></i>Agregar Usuario</h5>
                    </div>
                    <div class="card-body">
                        <div id="alerts-proyecto1"></div>
                        <form id="userForm">
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre</label>
                                <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Ingrese su nombre">
                                <div class="invalid-feedback"></div>
                            </div>
                            <div class="mb-3">
                                <label for="emailUsuario" class="form-label">Email</label>
                                <div class="input-group email-group">
                                    <input type="text" class="form-control" id="emailUsuario" name="emailUsuario" placeholder="username">
                                    <span class="input-group-text">@</span>
                                    <input type="text" class="form-control" id="emailProveedor" name="emailProveedor" placeholder="mail">
                                    <span class="input-group-text">.</span>
                                    <select class="form-select" id="emailDominio" name="emailDominio">
                                        <option value="com">com</option>
                                        <option value="ar">ar</option>
                                        <option value="com.ar">com.ar</option>
                                        <option value="edu.ar">edu.ar</option>
                                        <option value="gov.ar">gov.ar</option>
                                        <option value="net">net</option>
                                        <option value="org">org</option>
                                    </select>
                                </div>
                                <div class="invalid-feedback"></div>
                            </div>
                            <div class="mb-3">
                                <label for="edad" class="form-label">Edad</label>
                                <input type="text" class="form-control" id="edad" name="edad" placeholder="Ingrese su edad">
                                <div class="invalid-feedback"></div>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-save me-2"></i>Agregar Usuario
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-lg-7">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0"><i class="bi bi-list-ul me-2"></i>Usuarios Registrados</h5>
                        <span class="badge bg-primary rounded-pill" id="usersCount"></span>
                    </div>
                    <div class="card-body">
                        <div class="row" id="usersList"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div class="modal fade" id="confirmModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="confirmModalTitle">Confirmar acción</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="confirmModalBody">
                    ¿Está seguro de realizar esta acción?
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-danger" id="confirmModalBtn">Confirmar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/validations.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/forms.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
